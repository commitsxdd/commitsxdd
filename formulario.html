<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Project Request Form

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href=
"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#1e293b
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

color:white;

}

.container{

width:100%;

max-width:1000px;

background:
rgba(
15,
23,
42,
0.88
);

padding:50px;

border-radius:30px;

backdrop-filter:
blur(18px);

box-shadow:
0 0 60px
rgba(
56,
189,
248,
0.2
);

}

h1{

text-align:center;

font-size:42px;

margin-bottom:10px;

color:#38bdf8;

}

.subtitle{

text-align:center;

margin-bottom:35px;

}

form{

display:grid;

grid-template-columns:
1fr 1fr;

gap:20px;

}

.full{

grid-column:
span 2;

}

input,
textarea,
select{

width:100%;

padding:16px;

border:none;

border-radius:14px;

background:#1e293b;

color:white;

outline:none;

}

textarea{

height:160px;

resize:none;

}

.tech{

display:grid;

grid-template-columns:
repeat(
3,
1fr
);

gap:12px;

}

.tech label{

background:#1e293b;

padding:12px;

border-radius:12px;

cursor:pointer;

}

button{

grid-column:
span 2;

padding:18px;

border:none;

border-radius:15px;

font-size:18px;

font-weight:700;

cursor:pointer;

background:#38bdf8;

transition:.3s;

}

button:hover{

transform:
translateY(-5px);

}

.footer{

margin-top:30px;

text-align:center;

opacity:.8;

}

@media(max-width:800px){

form{

grid-template-columns:
1fr;

}

.full{

grid-column:
span 1;

}

button{

grid-column:
span 1;

}

}

</style>

</head>

<body>

<div class="container">

<h1>

📋 Project Request Form

</h1>

<p class="subtitle">

Complete the information to request a project.

</p>

<form id="clientForm">

<input
type="text"

placeholder=
"Full Name"

required>

<input
type="email"

placeholder=
"Email"

required>

<input
type="text"

placeholder=
"Company">

<input
type="text"

placeholder=
"Phone">

<select>

<option>

Website

</option>

<option>

Business System

</option>

<option>

Database

</option>

<option>

Portfolio

</option>

<option>

Application

</option>

</select>

<select>

<option>

Low Priority

</option>

<option>

Medium Priority

</option>

<option>

High Priority

</option>

</select>

<input
class="full"

type="number"

placeholder=
"Estimated Budget">

<input
class="full"

type="date">

<div class="full">

<h3>

Technologies

</h3>

<br>

<div class="tech">

<label>

<input type="checkbox">

HTML

</label>

<label>

<input type="checkbox">

CSS

</label>

<label>

<input type="checkbox">

JavaScript

</label>

<label>

<input type="checkbox">

PHP

</label>

<label>

<input type="checkbox">

MySQL

</label>

<label>

<input type="checkbox">

Python

</label>

</div>

</div>

<textarea

class="full"

placeholder=
"Describe your project in detail">

</textarea>

<button>

Send Request

</button>

</form>

<div class="footer">

Edwin Mendez © 2026

</div>

</div>

<script>

document
.getElementById(
"clientForm"
)

.addEventListener(

"submit",

function(e){

e.preventDefault();

alert(
"Request sent successfully"
);

}

);

</script>

</body>

</html>
